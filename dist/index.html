<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estética Genevive</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />

    <style>
      :root {
        --rosa:       #C9A0A0;
        --creme:      #FAF7F4;
        --dourado:    #B8975A;
        --grafite:    #2C2C2C;
        --rosa-claro: #F2E8E8;
      }
      * { box-sizing: border-box; }
      body { font-family: 'Jost', sans-serif; background-color: var(--creme); color: var(--grafite); }

      .font-serif   { font-family: 'Cormorant Garamond', serif; }
      .text-dourado { color: var(--dourado) !important; }
      .text-rosa    { color: var(--rosa)    !important; }
      .text-grafite { color: var(--grafite) !important; }

      .bg-creme      { background-color: var(--creme)      !important; }
      .bg-rosa-claro { background-color: var(--rosa-claro) !important; }
      .bg-grafite    { background-color: var(--grafite)    !important; }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: var(--dourado);
      }
      .gold-divider {
        width: 48px; height: 1px;
        background: var(--dourado);
        display: block;
      }
      .btn-genevive {
        padding: 14px 40px;
        font-size: 11px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        background: var(--grafite);
        color: #fff;
        border: none;
        border-radius: 0;
        font-family: 'Jost', sans-serif;
        transition: background .3s;
        cursor: pointer;
      }
      .btn-genevive:hover { background: var(--dourado); color: #fff; }

      .btn-outline-dourado {
        padding: 10px 26px;
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: transparent;
        color: var(--dourado);
        border: 1px solid var(--dourado);
        border-radius: 0;
        font-family: 'Jost', sans-serif;
        transition: all .3s;
        cursor: pointer;
      }
      .btn-outline-dourado:hover { background: var(--dourado); color: #fff; }

      .form-genevive .form-control,
      .form-genevive .form-select {
        border: none;
        border-bottom: 1px solid #E5E0DB;
        border-radius: 0;
        background: transparent;
        padding: 12px 0;
        font-family: 'Jost', sans-serif;
        font-weight: 300;
        font-size: 14px;
        box-shadow: none !important;
        transition: border-color .3s;
      }
      .form-genevive .form-control:focus,
      .form-genevive .form-select:focus { border-bottom-color: var(--dourado); }
      .form-genevive label {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
